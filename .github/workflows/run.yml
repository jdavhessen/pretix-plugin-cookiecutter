name: Try result

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: lint and test (${{ matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        level:
          - PLUGIN_LEVEL_EVENT
          - PLUGIN_LEVEL_ORGANIZER
          - PLUGIN_LEVEL_EVENT_ORGANIZER_HYBRID
    steps:
      - name: Install system dependencies
        run: sudo apt update && sudo apt install gettext
      - uses: actions/checkout@v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v1
        with:
          python-version: 3.11
      - name: Install cookiecutter
        run: pip3 install cookiecutter
      - name: Run cookiecutter
        run: cookiecutter . --no-input level=${{ matrix.level }}
      - name: Init git repo (required for check-manifest)
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git init
          git add .
          git commit -m 'feat: initial commit'
        working-directory: pretix-superplugin
      - name: Install pretix
        run: pip3 install uv && uv pip install --system pretix
        working-directory: pretix-superplugin
      - name: Install Dependencies
        run: uv pip install --system -U ruff commitizen twine check-manifest pytest pytest-django -e .
        working-directory: pretix-superplugin
      - name: Check that migrations match the models
        run: python -m pretix makemigrations pretix_superplugin --check --dry-run
        working-directory: pretix-superplugin
      - name: Run ruff format --check
        run: ruff format --check .
        working-directory: pretix-superplugin
      - name: Run ruff check
        run: ruff check .
        working-directory: pretix-superplugin
      - name: Bump version with commitizen
        run: cz bump --yes
        working-directory: pretix-superplugin
      - name: Run check-manifest
        run: check-manifest .
        working-directory: pretix-superplugin
      - name: Build package
        run: python setup.py sdist
        working-directory: pretix-superplugin
      - name: Check package
        run: twine check dist/*
        working-directory: pretix-superplugin
      - name: Run tests
        run: py.test tests
        working-directory: pretix-superplugin
