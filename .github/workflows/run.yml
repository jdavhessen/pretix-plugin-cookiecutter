name: Try result

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: lint and test (${{ matrix.level }}, ${{ matrix.license }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        level:
          - PLUGIN_LEVEL_EVENT
          - PLUGIN_LEVEL_ORGANIZER
          - PLUGIN_LEVEL_EVENT_ORGANIZER_HYBRID
        license: [Apache]
        include:
          - level: PLUGIN_LEVEL_EVENT
            license: All rights reserved
    steps:
      - name: Install system dependencies
        run: sudo apt update && sudo apt install gettext
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Run cookiecutter
        run: uvx cookiecutter . --no-input level="${{ matrix.level }}" license="${{ matrix.license }}"
      - name: Init git repo (required for check-manifest)
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git init
          git add .
          git commit -m 'feat: initial commit'
        working-directory: pretix-superplugin
      - name: Install dependencies
        run: uv sync --group test
        working-directory: pretix-superplugin
      - name: Check that migrations match the models
        run: uv run python -m pretix makemigrations pretix_superplugin --check --dry-run
        working-directory: pretix-superplugin
      - name: Run ruff format --check
        run: uv run ruff format --check .
        working-directory: pretix-superplugin
      - name: Run ruff check
        run: uv run ruff check .
        working-directory: pretix-superplugin
      - name: Bump version with commitizen
        run: uv run cz bump --yes
        working-directory: pretix-superplugin
      - name: Run check-manifest
        run: uvx --with build --with setuptools --with pretix-plugin-build check-manifest .
        working-directory: pretix-superplugin
      - name: Build package
        run: uv build
        working-directory: pretix-superplugin
      - name: Check package
        run: uvx twine check dist/*
        working-directory: pretix-superplugin
      - name: Run tests
        run: uv run pytest tests
        working-directory: pretix-superplugin
